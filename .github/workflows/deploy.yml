name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & push Docker images
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message,
      '(build)'))
    runs-on: [self-hosted, cihuy-service]
    
    steps:
      # 1. NOTIFY: Workflow Triggered
      - name: Notify Workflow Started
        if: always()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content": "🚀 **Deploy Workflow Started** for commit `${{ github.sha }}` in `${{ github.repository }}`"}' \
            ${{ secrets.DISCORD_WEBHOOK }}

      - name: Checkout code
        uses: actions/checkout@v4
       # 2. NOTIFY: Runner Picked Up
      - name: Notify Runner Active
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content": "🏃 **Runner picked up the job! ** Building and pushing Docker images..."}' \
            ${{ secrets.DISCORD_WEBHOOK }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Run CI script
        run: ./ci.sh docker-build-push
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

       # 3. NOTIFY: Success (with Image Details)
      - name: Notify Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content": "✅ **Build & Push Success!
            **\nRepo: `${{ github.repository }}`\nImages:
            \n- `${{ secrets.REGISTRY_URL }}/blog-backend:
            ${{ github.sha }}`\n-
            `${{ secrets.REGISTRY_URL }}/blog-frontend:
            ${{ github.sha }}`"}' \
            ${{ secrets.DISCORD_WEBHOOK }}

      # 4. NOTIFY: Failure
      - name: Notify Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content": "❌ **Build & Push Failed!**
            Check the workflow logs for details."}' \
            ${{ secrets.DISCORD_WEBHOOK }}